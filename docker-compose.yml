services:
  mysql:
    image: mysql:8.0
    container_name: rono-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rono_root_password
      MYSQL_DATABASE: rono_lr
      MYSQL_USER: rono
      MYSQL_PASSWORD: rono_local_password
    ports:
      - "3306:3306"
    volumes:
      - rono_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prono_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rono_mysql_data:
